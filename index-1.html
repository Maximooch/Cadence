<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadence Scheduler</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;

      const DAYS_OF_WEEK = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
      const COLORS = ['#7c3aed', '#2563eb', '#0891b2', '#059669', '#65a30d', '#ca8a04', '#ea580c', '#dc2626', '#db2777', '#4f46e5'];

      const formatHour = (hour) => {
        const h = Math.floor(hour);
        const m = Math.round((hour - h) * 60);
        const period = h >= 12 ? 'pm' : 'am';
        const displayHour = h === 0 ? 12 : h > 12 ? h - 12 : h;
        return m === 0 ? `${displayHour}${period}` : `${displayHour}:${m.toString().padStart(2, '0')}${period}`;
      };

      const format24Hour = (hour) => {
        const h = Math.floor(hour);
        const m = Math.round((hour - h) * 60);
        return m === 0 ? `${h.toString().padStart(2, '0')}00` : `${h.toString().padStart(2, '0')}${m.toString().padStart(2, '0')}`;
      };

      function SchedulerApp() {
        const [config, setConfig] = useState(null);
        const [selectedDay, setSelectedDay] = useState('');
        const [tasks, setTasks] = useState([]);
        const [wakeTime, setWakeTime] = useState(8.5);
        const [sleepTime, setSleepTime] = useState(23);
        const [editingTask, setEditingTask] = useState(null);
        const [showAddForm, setShowAddForm] = useState(false);
        const [newTask, setNewTask] = useState({ name: '', duration: 1, color: COLORS[0] });
        const [currentTime, setCurrentTime] = useState(new Date());
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);

        // Load YAML configuration
        useEffect(() => {
          const today = new Date().toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
          setSelectedDay(today);

          fetch('schedule.yml')
            .then(response => {
              if (!response.ok) {
                throw new Error(`Failed to load schedule.yml: ${response.status}`);
              }
              return response.text();
            })
            .then(yamlText => {
              try {
                const parsed = jsyaml.load(yamlText);
                setConfig(parsed);
                
                // Load saved wake/sleep times from localStorage
                const savedWakeTime = localStorage.getItem('scheduler-wakeTime');
                const savedSleepTime = localStorage.getItem('scheduler-sleepTime');
                if (savedWakeTime) setWakeTime(parseFloat(savedWakeTime));
                if (savedSleepTime) setSleepTime(parseFloat(savedSleepTime));
                else if (parsed.sleep_time) setSleepTime(parsed.sleep_time);
                if (parsed.wake_time && !savedWakeTime) setWakeTime(parsed.wake_time);
                
                setLoading(false);
              } catch (e) {
                throw new Error(`Failed to parse YAML: ${e.message}`);
              }
            })
            .catch(err => {
              console.error('Error loading config:', err);
              setError(err.message);
              setLoading(false);
            });
        }, []);

        // Load tasks when day changes
        useEffect(() => {
          if (!config) return;
          
          const dayConfig = config.days?.[selectedDay];
          const yamlTasks = dayConfig?.tasks || config.default_tasks || [];
          
          // Try to load saved tasks for this day from localStorage
          const savedTasks = localStorage.getItem(`scheduler-tasks-${selectedDay}`);
          if (savedTasks) {
            setTasks(JSON.parse(savedTasks));
          } else {
            setTasks(yamlTasks);
          }
        }, [config, selectedDay]);

        // Save tasks to localStorage when they change
        useEffect(() => {
          if (tasks.length > 0) {
            localStorage.setItem(`scheduler-tasks-${selectedDay}`, JSON.stringify(tasks));
          }
        }, [tasks, selectedDay]);

        // Save wake/sleep times
        useEffect(() => {
          localStorage.setItem('scheduler-wakeTime', wakeTime);
        }, [wakeTime]);

        useEffect(() => {
          localStorage.setItem('scheduler-sleepTime', sleepTime);
        }, [sleepTime]);

        // Update current time every minute
        useEffect(() => {
          const timer = setInterval(() => setCurrentTime(new Date()), 60000);
          return () => clearInterval(timer);
        }, []);

        if (loading) {
          return (
            <div className="min-h-screen bg-gray-900 text-white flex items-center justify-center">
              <div className="text-center">
                <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-white mx-auto mb-4"></div>
                <p>Loading schedule configuration...</p>
              </div>
            </div>
          );
        }

        if (error) {
          return (
            <div className="min-h-screen bg-gray-900 text-white flex items-center justify-center p-6">
              <div className="bg-red-900/30 border border-red-700 rounded-lg p-6 max-w-lg">
                <h2 className="text-xl font-bold text-red-400 mb-2">Error Loading Configuration</h2>
                <p className="text-red-300">{error}</p>
                <p className="text-gray-400 text-sm mt-4">
                  Make sure schedule.yml exists in the same directory and is valid YAML.
                </p>
              </div>
            </div>
          );
        }

        if (!config) {
          return null;
        }

        // Handle next-day sleep times (midnight)
        const displaySleepTime = sleepTime < wakeTime ? sleepTime + 24 : sleepTime;
        const adjustedTotalHours = displaySleepTime - wakeTime;
        const isValidSchedule = adjustedTotalHours > 0.5 && adjustedTotalHours <= 24;

        const schedule = [];
        let currentTimeCalc = wakeTime;
        
        tasks.forEach((task) => {
          schedule.push({
            ...task,
            startTime: currentTimeCalc,
            endTime: currentTimeCalc + task.duration,
          });
          currentTimeCalc += task.duration;
        });
        
        const totalTaskTime = tasks.reduce((sum, t) => sum + t.duration, 0);
        const adjustedRemainingTime = adjustedTotalHours - totalTaskTime;
        
        const currentHour = currentTime.getHours() + currentTime.getMinutes() / 60;

        // Prevent invalid time combinations
        const handleWakeTimeChange = (e) => {
          const [h, m] = e.target.value.split(':').map(Number);
          const newWakeTime = h + m / 60;
          if (newWakeTime < displaySleepTime - 0.5) {
            setWakeTime(newWakeTime);
          }
        };

        const handleSleepTimeChange = (e) => {
          const [h, m] = e.target.value.split(':').map(Number);
          const newSleepTime = h + m / 60;
          if (newSleepTime > wakeTime + 0.5) {
            setSleepTime(newSleepTime);
          }
        };

        const handleAddTask = () => {
          if (newTask.name && newTask.duration > 0) {
            setTasks([...tasks, { ...newTask, id: Date.now() }]);
            setNewTask({ name: '', duration: 1, color: COLORS[0] });
            setShowAddForm(false);
          }
        };

        const handleUpdateTask = (id, updatedTask) => {
          setTasks(tasks.map(t => t.id === id ? { ...t, ...updatedTask } : t));
          setEditingTask(null);
        };

        const handleDeleteTask = (id) => {
          setTasks(tasks.filter(t => t.id !== id));
        };

        const handleMoveTask = (id, direction) => {
          const index = tasks.findIndex(t => t.id === id);
          if (direction === 'up' && index > 0) {
            const newTasks = [...tasks];
            [newTasks[index - 1], newTasks[index]] = [newTasks[index], newTasks[index - 1]];
            setTasks(newTasks);
          } else if (direction === 'down' && index < tasks.length - 1) {
            const newTasks = [...tasks];
            [newTasks[index], newTasks[index + 1]] = [newTasks[index + 1], newTasks[index]];
            setTasks(newTasks);
          }
        };

        const resetToDefault = () => {
          if (confirm('Reset this day to default schedule?')) {
            const dayConfig = config.days?.[selectedDay];
            const yamlTasks = dayConfig?.tasks || config.default_tasks || [];
            setTasks(yamlTasks);
            localStorage.removeItem(`scheduler-tasks-${selectedDay}`);
          }
        };

        const morningHours = Array.from({ length: 12 }, (_, i) => i);
        const afternoonHours = Array.from({ length: 12 }, (_, i) => i + 12);

        // Time presets
        const wakePresets = [6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10];
        const sleepPresets = [21, 21.5, 22, 22.5, 23, 23.5, 0, 0.5];

        const optionalTasks = config.optional_tasks || [];

        return (
          <div className="min-h-screen bg-gray-900 text-white p-6">
            <div className="max-w-7xl mx-auto">
              <div className="flex justify-between items-start mb-6">
                <div>
                  <h1 className="text-3xl font-bold mb-2">Cadence Scheduler</h1>
                  <p className="text-gray-400">
                    {formatHour(wakeTime)} wake → {formatHour(sleepTime)} sleep • {adjustedTotalHours.toFixed(1)}hr available • {totalTaskTime.toFixed(1)}hr scheduled • {adjustedRemainingTime > 0 ? `${adjustedRemainingTime.toFixed(1)}hr buffer` : `${Math.abs(adjustedRemainingTime).toFixed(1)}h over`}
                  </p>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => setShowAddForm(!showAddForm)}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition"
                  >
                    {showAddForm ? 'Cancel' : '+ Add Task'}
                  </button>
                  <button
                    onClick={resetToDefault}
                    className="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg font-medium transition"
                  >
                    Reset Day
                  </button>
                </div>
              </div>

              {/* Day Selector */}
              <div className="mb-6 bg-gray-800 rounded-lg p-4 border border-gray-700">
                <label className="text-sm text-gray-400 mb-2 block">Select Day:</label>
                <div className="flex flex-wrap gap-2">
                  {DAYS_OF_WEEK.map((day) => {
                    const hasCustomConfig = config.days?.[day];
                    const isToday = day === new Date().toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
                    return (
                      <button
                        key={day}
                        onClick={() => setSelectedDay(day)}
                        className={`
                          px-4 py-2 rounded-lg font-medium capitalize transition-all
                          ${selectedDay === day 
                            ? 'bg-blue-600 text-white' 
                            : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                          }
                        `}
                      >
                        {day}
                        {isToday && ' (Today)'}
                        {hasCustomConfig && selectedDay !== day && ' •'}
                      </button>
                    );
                  })}
                </div>
              </div>

              {showAddForm && (
                <div className="mb-6 bg-gray-800 rounded-lg p-4 border border-gray-700">
                  <h3 className="text-lg font-semibold mb-3">Add New Task</h3>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input
                      type="text"
                      placeholder="Task name"
                      value={newTask.name}
                      onChange={(e) => setNewTask({ ...newTask, name: e.target.value })}
                      className="px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <input
                      type="number"
                      step="0.25"
                      min="0.25"
                      placeholder="Duration (hours)"
                      value={newTask.duration}
                      onChange={(e) => setNewTask({ ...newTask, duration: parseFloat(e.target.value) || 0 })}
                      className="px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <select
                      value={newTask.color}
                      onChange={(e) => setNewTask({ ...newTask, color: e.target.value })}
                      className="px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                      {COLORS.map(color => (
                        <option key={color} value={color}>{color}</option>
                      ))}
                    </select>
                    <button
                      onClick={handleAddTask}
                      className="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg font-medium transition"
                    >
                      Add Task
                    </button>
                  </div>
                </div>
              )}

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
                <div className="bg-gray-800 rounded-lg p-4 border border-gray-700">
                  <label className="block text-sm font-medium text-gray-400 mb-2">Wake Time</label>
                  <div className="flex gap-2 mb-2">
                    <input
                      type="time"
                      value={`${Math.floor(wakeTime).toString().padStart(2, '0')}:${Math.round((wakeTime % 1) * 60).toString().padStart(2, '0')}`}
                      onChange={handleWakeTimeChange}
                      className="flex-1 px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <div className="flex flex-wrap gap-1">
                    {wakePresets.map(time => (
                      <button
                        key={time}
                        onClick={() => time < displaySleepTime - 0.5 && setWakeTime(time)}
                        disabled={time >= displaySleepTime - 0.5}
                        className={`text-xs px-2 py-1 rounded transition ${
                          wakeTime === time 
                            ? 'bg-blue-600 text-white' 
                            : time >= displaySleepTime - 0.5 
                              ? 'bg-gray-700 text-gray-500 cursor-not-allowed' 
                              : 'bg-gray-700 hover:bg-gray-600'
                        }`}
                      >
                        {formatHour(time)}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-gray-800 rounded-lg p-4 border border-gray-700">
                  <label className="block text-sm font-medium text-gray-400 mb-2">Sleep Time</label>
                  <div className="flex gap-2 mb-2">
                    <input
                      type="time"
                      value={`${Math.floor(sleepTime).toString().padStart(2, '0')}:${Math.round((sleepTime % 1) * 60).toString().padStart(2, '0')}`}
                      onChange={handleSleepTimeChange}
                      className="flex-1 px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <div className="flex flex-wrap gap-1">
                    {sleepPresets.map(time => (
                      <button
                        key={time}
                        onClick={() => time > wakeTime + 0.5 && setSleepTime(time)}
                        disabled={time <= wakeTime + 0.5}
                        className={`text-xs px-2 py-1 rounded transition ${
                          sleepTime === time 
                            ? 'bg-blue-600 text-white' 
                            : time <= wakeTime + 0.5 
                              ? 'bg-gray-700 text-gray-500 cursor-not-allowed' 
                              : 'bg-gray-700 hover:bg-gray-600'
                        }`}
                      >
                        {formatHour(time)}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-gray-800 rounded-lg p-4 border border-gray-700">
                  <label className="block text-sm font-medium text-gray-400 mb-2">Current Time</label>
                  <div className="text-2xl font-bold text-blue-400">
                    {formatHour(currentHour)}
                  </div>
                </div>
              </div>

              {!isValidSchedule && (
                <div className="mb-6 bg-red-900/30 border border-red-700 rounded-lg p-4">
                  <div className="font-semibold text-red-400">⚠️ Invalid Schedule</div>
                  <div className="text-sm text-red-300 mt-1">
                    Sleep time must be at least 30 minutes after wake time.
                  </div>
                </div>
              )}

              <div className="mb-8">
                <h2 className="text-xl font-semibold mb-3">Timeline</h2>
                <div className="relative bg-gray-800 rounded-lg p-4 border border-gray-700">
                  <div className="flex justify-between text-xs text-gray-500 mb-2 px-1">
                    {isValidSchedule && Array.from({ length: Math.ceil(adjustedTotalHours) + 1 }, (_, i) => {
                      const hour = wakeTime + i;
                      return (
                        <span key={i} className="w-0 text-center" style={{ marginLeft: i === 0 ? 0 : -10 }}>
                          {formatHour(hour)}
                        </span>
                      );
                    })}
                  </div>
                  
                  <div className="relative h-14 bg-gray-700 rounded overflow-hidden">
                    {isValidSchedule && schedule.map((block) => {
                      const leftPercent = ((block.startTime - wakeTime) / adjustedTotalHours) * 100;
                      const widthPercent = (block.duration / adjustedTotalHours) * 100;
                      return (
                        <div
                          key={block.id}
                          className="absolute h-full flex items-center justify-center text-xs font-medium overflow-hidden cursor-pointer hover:opacity-80 transition"
                          style={{
                            left: `${leftPercent}%`,
                            width: `${widthPercent}%`,
                            backgroundColor: block.color,
                          }}
                          onClick={() => setEditingTask(block)}
                          title={`${block.name}: ${formatHour(block.startTime)} - ${formatHour(block.endTime)}`}
                        >
                          <span className="truncate px-1">{block.name}</span>
                        </div>
                      );
                    })}
                    
                    {isValidSchedule && currentHour >= wakeTime && currentHour <= displaySleepTime && (
                      <div
                        className="absolute top-0 bottom-0 w-0.5 bg-white shadow-lg z-10"
                        style={{ left: `${Math.max(0, Math.min(100, ((currentHour - wakeTime) / adjustedTotalHours) * 100))}%` }}
                      >
                        <div className="absolute -top-1 -left-1.5 w-3 h-3 bg-white rounded-full"></div>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div className="mb-8">
                <h2 className="text-xl font-semibold mb-3">Tasks</h2>
                <div className="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
                  <table className="w-full">
                    <thead>
                      <tr className="bg-gray-750 border-b border-gray-700">
                        <th className="text-left py-3 px-4 text-sm font-medium text-gray-400 w-12">#</th>
                        <th className="text-left py-3 px-4 text-sm font-medium text-gray-400">Task</th>
                        <th className="text-left py-3 px-4 text-sm font-medium text-gray-400">Start</th>
                        <th className="text-left py-3 px-4 text-sm font-medium text-gray-400">End</th>
                        <th className="text-left py-3 px-4 text-sm font-medium text-gray-400">Duration</th>
                        <th className="text-left py-3 px-4 text-sm font-medium text-gray-400 w-24">Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      {schedule.map((block, idx) => (
                        <tr 
                          key={block.id} 
                          className={`border-b border-gray-700 ${idx % 2 === 0 ? 'bg-gray-800' : 'bg-gray-750'} ${currentHour >= block.startTime && currentHour < block.endTime ? 'ring-2 ring-blue-500' : ''}`}
                        >
                          <td className="py-3 px-4">
                            <div 
                              className="w-8 h-8 rounded flex items-center justify-center text-sm font-bold cursor-pointer hover:opacity-80 transition"
                              style={{ backgroundColor: block.color }}
                              onClick={() => setEditingTask(block)}
                            >
                              {idx + 1}
                            </div>
                          </td>
                          <td className="py-3 px-4 font-medium cursor-pointer hover:text-blue-400 transition" onClick={() => setEditingTask(block)}>
                            {block.name}
                          </td>
                          <td className="py-3 px-4 font-mono text-sm text-gray-300">{formatHour(block.startTime)}</td>
                          <td className="py-3 px-4 font-mono text-sm text-gray-300">{formatHour(block.endTime)}</td>
                          <td className="py-3 px-4 text-sm text-gray-300">
                            {block.duration >= 1 
                              ? `${Math.floor(block.duration)}h ${block.duration % 1 ? Math.round((block.duration % 1) * 60) + 'm' : ''}`
                              : `${Math.round(block.duration * 60)}m`
                            }
                          </td>
                          <td className="py-3 px-4">
                            <div className="flex gap-1">
                              <button
                                onClick={() => handleMoveTask(block.id, 'up')}
                                disabled={idx === 0}
                                className="p-1 hover:bg-gray-600 rounded disabled:opacity-30 disabled:cursor-not-allowed transition"
                                title="Move up"
                              >
                                ↑
                              </button>
                              <button
                                onClick={() => handleMoveTask(block.id, 'down')}
                                disabled={idx === tasks.length - 1}
                                className="p-1 hover:bg-gray-600 rounded disabled:opacity-30 disabled:cursor-not-allowed transition"
                                title="Move down"
                              >
                                ↓
                              </button>
                              <button
                                onClick={() => setEditingTask(block)}
                                className="p-1 hover:bg-blue-600 rounded transition"
                                title="Edit"
                              >
                                ✎
                              </button>
                              <button
                                onClick={() => handleDeleteTask(block.id)}
                                className="p-1 hover:bg-red-600 rounded transition"
                                title="Delete"
                              >
                                ×
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Optional/Parallel Tasks */}
              {optionalTasks.length > 0 && (
                <div className="mb-8">
                  <h2 className="text-xl font-semibold mb-3 text-gray-400">Optional / Parallel</h2>
                  <div className="bg-gray-800/50 rounded-lg border border-gray-700 border-dashed p-4">
                    {optionalTasks.map((task) => (
                      <div key={task.id} className="flex items-center gap-3">
                        <div 
                          className="w-8 h-8 rounded flex items-center justify-center text-sm font-bold opacity-70"
                          style={{ backgroundColor: task.color }}
                        >
                          {task.id}
                        </div>
                        <span className="text-gray-400">{task.name}</span>
                        <span className="text-gray-500 text-sm ml-auto">~{task.duration}h</span>
                      </div>
                    ))}
                    <p className="text-xs text-gray-500 mt-3 italic">
                      Can be done in parallel during breaks, waiting, or interleaved with other tasks
                    </p>
                  </div>
                </div>
              )}

              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="bg-gray-800 rounded-lg p-4 border border-gray-700">
                  <div className="text-2xl font-bold text-green-400">{adjustedTotalHours.toFixed(1)}h</div>
                  <div className="text-sm text-gray-400">Available</div>
                </div>
                <div className="bg-gray-800 rounded-lg p-4 border border-gray-700">
                  <div className="text-2xl font-bold text-blue-400">{totalTaskTime.toFixed(1)}h</div>
                  <div className="text-sm text-gray-400">Scheduled</div>
                </div>
                <div className="bg-gray-800 rounded-lg p-4 border border-gray-700">
                  <div className={`text-2xl font-bold ${adjustedRemainingTime >= 0 ? 'text-yellow-400' : 'text-red-400'}`}>
                    {adjustedRemainingTime >= 0 ? `${adjustedRemainingTime.toFixed(1)}h` : `-${Math.abs(adjustedRemainingTime).toFixed(1)}h`}
                  </div>
                  <div className="text-sm text-gray-400">{adjustedRemainingTime >= 0 ? 'Buffer' : 'Over'}</div>
                </div>
                <div className="bg-gray-800 rounded-lg p-4 border border-gray-700">
                  <div className="text-2xl font-bold text-purple-400">{tasks.length}</div>
                  <div className="text-sm text-gray-400">Tasks</div>
                </div>
              </div>

              {adjustedRemainingTime < 0 && (
                <div className="mt-6 bg-red-900/30 border border-red-700 rounded-lg p-4">
                  <div className="font-semibold text-red-400">⚠️ Schedule Overrun</div>
                  <div className="text-sm text-red-300 mt-1">
                    You're {Math.abs(adjustedRemainingTime).toFixed(1)} hours over. End time: {formatHour(schedule[schedule.length - 1]?.endTime || sleepTime)}.
                  </div>
                </div>
              )}

              {editingTask && (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50" onClick={() => setEditingTask(null)}>
                  <div className="bg-gray-800 rounded-lg p-6 border border-gray-700 max-w-md w-full mx-4" onClick={(e) => e.stopPropagation()}>
                    <h3 className="text-lg font-semibold mb-4">Edit Task</h3>
                    <div className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-400 mb-1">Task Name</label>
                        <input
                          type="text"
                          value={editingTask.name}
                          onChange={(e) => setEditingTask({ ...editingTask, name: e.target.value })}
                          className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-400 mb-1">Duration (hours)</label>
                        <input
                          type="number"
                          step="0.25"
                          min="0.25"
                          value={editingTask.duration}
                          onChange={(e) => setEditingTask({ ...editingTask, duration: parseFloat(e.target.value) || 0 })}
                          className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-400 mb-1">Color</label>
                        <div className="flex gap-2 flex-wrap">
                          {COLORS.map(color => (
                            <button
                              key={color}
                              onClick={() => setEditingTask({ ...editingTask, color })}
                              className={`w-8 h-8 rounded ${editingTask.color === color ? 'ring-2 ring-white' : ''}`}
                              style={{ backgroundColor: color }}
                            />
                          ))}
                        </div>
                      </div>
                      <div className="flex gap-2 pt-2">
                        <button
                          onClick={() => handleUpdateTask(editingTask.id, editingTask)}
                          className="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition"
                        >
                          Save
                        </button>
                        <button
                          onClick={() => handleDeleteTask(editingTask.id)}
                          className="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg font-medium transition"
                        >
                          Delete
                        </button>
                        <button
                          onClick={() => setEditingTask(null)}
                          className="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg font-medium transition"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<SchedulerApp />);
    </script>
</body>
</html>
